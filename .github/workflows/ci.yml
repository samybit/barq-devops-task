name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check Compose syntax
        run: docker compose config --quiet

      - name: Start containers
        run: docker compose up --build -d

      - name: Scan container image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: barq-assessment-app-01:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Run environment validation
        run: python3 validate.py

      - name: Run failure and recovery test
        run: python3 failure_test.py

      - name: Show logs if something fails
        if: failure()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down --volumes
